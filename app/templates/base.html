<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand }}{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-fg: #0f172a;
      --card: #1e293b;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    a { color: var(--accent); }
    header, footer {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
    }
    footer {
      border-top: 1px solid var(--border);
      border-bottom: none;
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 4rem;
    }
    header h1 { margin: 0; font-size: 1.5rem; }
    header h1 a { color: inherit; text-decoration: none; }
    main { max-width: 56rem; margin: 0 auto; padding: 2rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin: 1rem 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 1rem;
    }
    .btn {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:hover { filter: brightness(0.9); }
    .muted { color: var(--muted); }
    .error {
      background: #7f1d1d;
      color: #fee2e2;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; }
    pre {
      background: #020617;
      padding: 0.75rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      font-size: 0.8125rem;
      margin: 0;
    }
    code { font-family: ui-monospace, SFMono-Regular, monospace; }
    label { display: block; margin: 0.5rem 0 0.25rem; color: var(--muted); }
    select, input[type=text], input[type=email] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">{{ brand }}</a></h1>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    {{ brand }} — example portal · powered by an AI assistant subscription
  </footer>
</body>
</html>
