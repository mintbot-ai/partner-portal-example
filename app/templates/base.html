<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}{{ brand }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e1a;
      --bg-elev: #111726;
      --bg-soft: #161d2f;
      --fg: #e6ecf5;
      --fg-dim: #aab4c5;
      --muted: #6a7388;
      --accent: #7c5cff;
      --accent-2: #38bdf8;
      --accent-fg: #ffffff;
      --border: #232b3f;
      --border-soft: #1b2235;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 8px 24px -8px rgba(0, 0, 0, 0.4);
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124, 92, 255, 0.18), transparent 60%),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(56, 189, 248, 0.10), transparent 60%),
        var(--bg);
      color: var(--fg);
      line-height: 1.55;
      font-size: 16px;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent-2); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    h1, h2, h3 { line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 0.5rem; }
    h1 { font-size: clamp(2rem, 4vw, 2.75rem); font-weight: 700; }
    h2 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 600; }
    h3 { font-size: 1.125rem; font-weight: 600; }
    p { margin: 0 0 1rem; color: var(--fg-dim); }
    p:last-child { margin-bottom: 0; }
    code { font-family: var(--font-mono); font-size: 0.875em; }
    main {
      flex: 1;
      width: 100%;
      max-width: 64rem;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-soft);
      backdrop-filter: blur(8px);
      background: rgba(10, 14, 26, 0.6);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .wrap {
      max-width: 64rem;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brandmark {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      color: var(--fg);
      font-weight: 600;
      font-size: 1.0625rem;
      letter-spacing: -0.01em;
    }
    .brandmark:hover { text-decoration: none; }
    .brandmark-dot {
      width: 0.6rem; height: 0.6rem; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px rgba(124, 92, 255, 0.6);
    }
    .topnav { display: flex; gap: 1.5rem; align-items: center; font-size: 0.9375rem; }
    .topnav a { color: var(--fg-dim); }
    .topnav a:hover { color: var(--fg); text-decoration: none; }
    footer {
      padding: 2rem 1.5rem;
      border-top: 1px solid var(--border-soft);
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
    }
    footer .wrap { max-width: 64rem; margin: 0 auto; }
    .card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      transition: border-color 120ms ease, transform 120ms ease;
    }
    .card + .card { margin-top: 1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 1.25rem;
      margin-top: 2rem;
    }
    .plan-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }
    .plan-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .plan-card.featured {
      border-color: var(--accent);
      background: linear-gradient(160deg, rgba(124, 92, 255, 0.08), var(--bg-elev) 60%);
    }
    .plan-card .ribbon {
      position: absolute;
      top: -0.625rem;
      right: 1.25rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--accent-fg);
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.25rem 0.625rem;
      border-radius: 999px;
    }
    .plan-card h3 { color: var(--fg); margin-bottom: 0.25rem; }
    .plan-price {
      display: flex;
      align-items: baseline;
      gap: 0.375rem;
      margin: 0.75rem 0 0.5rem;
    }
    .plan-price .amount { font-size: 2rem; font-weight: 700; color: var(--fg); letter-spacing: -0.02em; }
    .plan-price .period { color: var(--muted); font-size: 0.875rem; }
    .plan-blurb { color: var(--fg-dim); font-size: 0.9375rem; flex: 1; margin-bottom: 1.25rem; }
    .plan-card .btn { width: 100%; text-align: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      background: linear-gradient(135deg, var(--accent), #6c4ce0);
      color: var(--accent-fg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-family: inherit;
      font-size: 0.9375rem;
      text-decoration: none;
      cursor: pointer;
      transition: filter 120ms ease, transform 100ms ease;
    }
    .btn:hover { filter: brightness(1.1); text-decoration: none; }
    .btn:active { transform: translateY(1px); }
    .btn.btn-ghost {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .btn.btn-ghost:hover { background: var(--bg-soft); filter: none; }
    .muted { color: var(--muted); }
    .dim { color: var(--fg-dim); }
    .alert {
      padding: 0.875rem 1.125rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.25rem;
      font-size: 0.9375rem;
      display: flex;
      align-items: flex-start;
      gap: 0.625rem;
    }
    .alert.alert-error {
      background: rgba(248, 113, 113, 0.10);
      color: #fecaca;
      border: 1px solid rgba(248, 113, 113, 0.25);
    }
    .alert.alert-info {
      background: rgba(56, 189, 248, 0.08);
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.20);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
    th, td {
      text-align: left;
      padding: 0.75rem 0.875rem;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 500; font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tr:last-child td { border-bottom: none; }
    pre {
      background: #050813;
      padding: 0.875rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      overflow-x: auto;
      font-size: 0.8125rem;
      font-family: var(--font-mono);
      line-height: 1.5;
      margin: 0;
      color: var(--fg-dim);
    }
    label { display: block; margin: 1rem 0 0.5rem; color: var(--fg-dim); font-size: 0.9375rem; font-weight: 500; }
    label:first-of-type { margin-top: 0; }
    select, input[type=text], input[type=email] {
      width: 100%;
      padding: 0.75rem 0.875rem;
      background: var(--bg-soft);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9375rem;
      font-family: inherit;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.2);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.1875rem 0.625rem;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 999px;
      font-family: var(--font-mono);
      letter-spacing: 0.01em;
      background: var(--bg-soft);
      color: var(--fg-dim);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .badge.badge-created  { background: rgba(56, 189, 248, 0.12); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.3); }
    .badge.badge-paid     { background: rgba(52, 211, 153, 0.12); color: #6ee7b7; border-color: rgba(52, 211, 153, 0.3); }
    .badge.badge-ready    { background: rgba(124, 92, 255, 0.12); color: #c4b5fd; border-color: rgba(124, 92, 255, 0.3); }
    .badge.badge-failed   { background: rgba(248, 113, 113, 0.12); color: #fca5a5; border-color: rgba(248, 113, 113, 0.3); }
    .badge.badge-partner  { background: rgba(251, 191, 36, 0.10); color: #fcd34d; border-color: rgba(251, 191, 36, 0.25); }
    details > summary {
      cursor: pointer;
      color: var(--accent-2);
      font-size: 0.8125rem;
      padding: 0.25rem 0;
      user-select: none;
      list-style: none;
    }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: "▸ "; display: inline-block; transition: transform 100ms ease; }
    details[open] > summary::before { transform: rotate(90deg); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin: 1.5rem 0 1rem;
    }
    .toolbar select, .toolbar input { width: auto; padding: 0.5rem 0.75rem; font-size: 0.875rem; }
    .test-mode-banner {
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      color: #1f2937;
      text-align: center;
      padding: 0.5625rem 1rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .test-mode-banner code {
      background: rgba(0, 0, 0, 0.18);
      padding: 0.0625rem 0.4rem;
      border-radius: 0.25rem;
    }
    .hero {
      text-align: center;
      padding: 1rem 0 1.5rem;
    }
    .eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-2);
      padding: 0.375rem 0.875rem;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.20);
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }
    .hero h1 {
      background: linear-gradient(180deg, var(--fg) 30%, #a4b0c8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero .lede {
      font-size: 1.125rem;
      max-width: 38rem;
      margin: 0.75rem auto 0;
      color: var(--fg-dim);
    }
    .feature-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .feature-row span { display: inline-flex; align-items: center; gap: 0.375rem; }
    .feature-row svg { width: 1rem; height: 1rem; color: var(--success); }
    .section-title {
      margin: 2.5rem 0 0.25rem;
      font-size: 0.8125rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 600;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      main { padding: 2rem 1rem 3rem; }
      header { padding: 1rem; }
      .plan-card { padding: 1.25rem; }
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% if test_mode %}
    <div class="test-mode-banner">
      TEST MODE — billing through MintOffice DEV (<code>{{ mintoffice_api_url }}</code>). No real charges.
    </div>
  {% endif %}
  <header>
    <div class="wrap">
      <a class="brandmark" href="/">
        <span class="brandmark-dot"></span>
        <span>{{ brand }}</span>
      </a>
      <nav class="topnav">
        <a href="/">Home</a>
        <a href="/buy">Plans</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="wrap">
      {{ brand }} · billing handled by Digital Cash OÜ on behalf of {{ brand }}
    </div>
  </footer>
</body>
</html>
